org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048M
android.useAndroidX=true
android.enableJetifier=false

# The build needs JDK 17 or newer. Gradle uses the JDK that Flutter passes in
# (`flutter config --jdk-dir`, Android Studio's JBR) or JAVA_HOME. Keep
# machine-specific overrides such as org.gradle.java.home out of this tracked
# file; put them in ~/.gradle/gradle.properties instead (docs/ANDROID_BUILD.md).

# Flutter 3.47+ and AGP 9 compile Kotlin without the legacy Android KGP.
android.builtInKotlin=true
# Flutter's Gradle integration still requires the legacy AGP DSL compatibility.
android.newDsl=false
