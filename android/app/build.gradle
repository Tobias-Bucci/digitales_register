plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '53'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.17.4'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def allowDebugSigningForRelease = (localProperties.getProperty('allowDebugSigningForRelease')
        ?: System.getenv('ALLOW_DEBUG_SIGNING_FOR_RELEASE')
        ?: 'false').toBoolean()

// Development builds always have their own application ID. Firebase is optional
// for those builds and must never change the installation's identity.
def developmentFirebaseConfigured = { String buildType ->
    def config = [file("src/${buildType}/google-services.json"), file('google-services.json')]
            .find { it.isFile() }
    if (config == null) return false
    def clients = new groovy.json.JsonSlurper().parse(config).client ?: []
    def packageName = "it.bucci.digitalesregister.${buildType}"
    return clients.any {
        it.client_info?.android_client_info?.package_name == packageName
    }
}
def debugFirebaseConfigured = developmentFirebaseConfigured('debug')
def profileFirebaseConfigured = developmentFirebaseConfigured('profile')

tasks.configureEach { task ->
    if ((task.name == 'processDebugGoogleServices' && !debugFirebaseConfigured) ||
            (task.name == 'processProfileGoogleServices' && !profileFirebaseConfigured)) {
        task.enabled = false
    }
}

android {
    namespace "it.bucci.digitalesregister"
    compileSdk 37
    ndkVersion "28.2.13676358"

    buildFeatures {
        resValues true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "it.bucci.digitalesregister"
        minSdkVersion flutter.minSdkVersion
        targetSdk 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resValue "bool", "firebase_configured", "true"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                // Supply unstripped native libraries for plugins/engine when available.
                // Flutter AOT symbols are uploaded separately with the Firebase CLI.
                def nativeSymbols = project.findProperty('crashlyticsNativeSymbolsDir')
                if (nativeSymbols) unstrippedNativeLibsDir file(nativeSymbols)
            }
            // Default: require the private release keystore.
            // Local override (explicit): set allowDebugSigningForRelease=true in local.properties
            // or ALLOW_DEBUG_SIGNING_FOR_RELEASE=true as environment variable.
            signingConfig allowDebugSigningForRelease ? signingConfigs.debug : signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // this is my (michael) release key. Used for dev purposes only.
            if (signingConfigs.release.keyAlias == "myandroidkey") {
                applicationIdSuffix ".irelease"
                resValue "string", "app_name", "Register"
            } else {
                // This is the normal release build type
                resValue "string", "app_name", "Register"
            }
        }
        debug {
            applicationIdSuffix ".debug"
            resValue "bool", "firebase_configured", debugFirebaseConfigured.toString()
            resValue "string", "app_name", "dr DEBUG"
        }
        profile {
            applicationIdSuffix ".profile"
            resValue "bool", "firebase_configured", profileFirebaseConfigured.toString()
            resValue "string", "app_name", "dr PROFILE"
        }
    }
}

flutter {
    source '../..'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Query the real pending schedule in settings; match the existing worker fork.
    implementation "androidx.work:work-runtime:2.11.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // Biometric app lock prompt; keep in sync with packages/biometric_storage.
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    // Required by Tink via androidx.security:security-crypto during R8 shrinking.
    implementation "com.google.errorprone:error_prone_annotations:2.28.0"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    // Firebase BoM and Analytics
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    // Flutter embeds native engine/AOT shared libraries: NDK crashes apply.
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
}
