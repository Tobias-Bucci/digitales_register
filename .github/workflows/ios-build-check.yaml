name: iOS build check

on:
  push:
    branches: [ios-build-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Get packages and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Build the app with the widget extension (device, debug, unsigned)
        run: flutter build ios --debug --no-codesign
      - name: Build the widget extension in Release
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            -target PlanningWidgets 2>&1 | tail -40 || true
          xcodebuild -project ios/Runner.xcodeproj -target PlanningWidgets -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
