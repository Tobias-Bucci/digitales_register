name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze and test
    # The tests pin HostPlatform to Windows (test/flutter_test_config.dart)
    # and load Roboto whatever its file case (#172), so they give the same
    # results on a Linux runner as on a Windows machine.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Get packages and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        # The live notification-server contract tests skip themselves
        # without DR_NOTIFICATIONS_E2E_URL.
        run: flutter test

  android-debug:
    name: Android debug build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Get packages and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Build
        # Compiles the native code of the forks in packages/ (workmanager,
        # biometric storage, file picker, FlutterFire). A debug build needs
        # no signing key, no google-services.json and uploads nothing to
        # Crashlytics; a release build would.
        run: flutter build apk --debug

  build-linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libjsoncpp-dev libstdc++-12-dev curl git unzip xz-utils \
            zip python3 dpkg-dev desktop-file-utils appstream xdg-utils \
            gnome-keyring dbus-x11 xvfb x11-utils libgl1-mesa-dri
      - name: Set up Flutter on the native architecture
        # Git bootstrap downloads the matching Linux Dart SDK on both architectures.
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Build and validate release packages
        run: bash tool/build_linux.sh "${{ matrix.arch }}"
      - name: Test platform policies and package validation
        run: |
          flutter test test/telemetry_capabilities_test.dart test/assessment_attachments_test.dart
          python3 tool/test_linux_packaging.py
      - name: Smoke test the native release
        run: bash tool/smoke_linux.sh "${{ matrix.arch }}"
      - name: Test the portable installation
        run: |
          for archive in build/linux/packages/*.tar.gz; do
            bash tool/test_linux_install.sh "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/linux/packages/*
          if-no-files-found: error

  test-packages:
    name: Package fork ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        # The forks whose tests run in the package itself without changing
        # tracked files.
        package: [collapsible_sidebar, quill_delta_viewer]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Test the package
        working-directory: packages/${{ matrix.package }}
        run: flutter test
      - name: Check that the tests changed no tracked files
        run: git diff --exit-code -- "packages/${{ matrix.package }}"

  publish-linux:
    if: github.event_name == 'release'
    needs: build-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: packages
          merge-multiple: true
      - name: Attach both architectures to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/* --clobber
