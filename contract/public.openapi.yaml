openapi: 3.1.0
info:
  title: Digitales Register Notifications API
  version: 1.2.0
  summary: Public, anonymous API for in-app notifications and polls.
  description: |
    Polling API consumed by the Digitales Register app on web, Android, iOS,
    Windows, Linux and macOS. No login. Reading sends no device identifier;
    only a vote carries the voter's random installation ID (see Polls).

    **Not confidential.** `platform` and `app_version` are supplied by the
    client and are not authenticated. Audience targeting decides what is
    relevant, it is not access control. Nothing sensitive is ever published
    through this API.

    **Polling.** Poll while the app is active, waiting `poll_after_seconds`
    between requests. Send the `ETag` of the last first-page response as
    `If-None-Match`.

    **ETag scope.** The `ETag` covers the *complete* applicable collection, not
    just the returned page. `304` on the first page therefore means no page has
    changed, and the client does not need to walk the cursors again.

    **Stale content.** On `304` keep the cached list, and still apply known
    `expires_at` values locally. On `429`, `5xx`, timeouts or offline keep the
    cached list and retry with exponential backoff plus jitter, honouring
    `Retry-After`. A client cannot learn about a revocation until it reconnects.

    **Compatibility.** Ignore unknown fields. `schema_version` increases only
    for breaking changes. Map unknown `type.icon` values to a safe fallback and
    treat an unknown internal `link.target` as no link.

    **Polls (1.2.0, additive).** A notification may carry a `poll` object.
    Clients that do not know `poll`, or its `type`, show the notification as
    usual: every poll notification also has an external `link` to a web page
    where anyone can vote, and its text makes sense without a poll screen.
    Polls never use an internal link.

    One vote per installation: the client sends a random UUID it created for
    itself (`voter`) with the vote and nothing else. The server keeps only a
    keyed hash of it per poll, so votes of different polls cannot be linked,
    and answers a second vote with `409` and the first choice. Results are
    aggregated counts; no per-voter data is ever returned. Reinstalling or
    clearing storage creates a new ID, so counts are votes per device, not
    persons.
  license:
    name: GNU General Public License v3.0 or later
    identifier: GPL-3.0-or-later
servers:
  - url: https://api.digitalesregister.com
    description: Production. Clients must take the base URL from configuration.
tags:
  - name: notifications
  - name: polls
  - name: health
paths:
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the active notifications applicable to this client.
      description: |
        Ordered by `published_at` descending, then `id` descending. `title` and
        `body` are plain text and must be rendered as such.
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Platform'
        - name: app_version
          in: query
          required: true
          description: Semantic version of the running app. Build metadata (`1.17.4+55`) is accepted and ignored.
          schema:
            type: string
            maxLength: 64
          example: 2.0.0
        - name: lang
          in: query
          required: false
          description: |
            Language tag such as `de`, `en`, `it` or `de-AT`; only the primary
            subtag is used. Missing, unsupported and untranslated languages
            fall back to German.
          schema:
            type: string
            maxLength: 35
            default: de
        - name: cursor
          in: query
          required: false
          description: Opaque `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of active notifications.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '304':
          description: The collection is unchanged since the supplied `ETag`. No body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          description: A parameter is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests. Wait for `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/polls/{id}:
    get:
      operationId: getPoll
      tags: [polls]
      summary: State of one poll, and its result if voters may see it.
      description: |
        Sends no identifier. `results` is present when the poll shows results
        to voters (while open, and after closing unless the poll disappears
        when it closes); it is the same for every caller. Revalidate with
        `If-None-Match` like the notifications list.

        `404` means the poll does not exist, has not started yet or was
        deleted. Treat it like a revoked notification: nothing can be voted.
      parameters:
        - $ref: '#/components/parameters/PollId'
        - name: lang
          in: query
          required: false
          description: Same rules as for the notifications list.
          schema:
            type: string
            maxLength: 35
            default: de
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The poll.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollState'
        '304':
          description: Unchanged since the supplied `ETag`. No body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          description: A parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such poll, or it has not started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/polls/{id}/vote:
    post:
      operationId: votePoll
      tags: [polls]
      summary: Casts the one vote of this installation.
      description: |
        Idempotent per installation and poll: repeating a vote, also after a
        timeout, returns `409 already_voted` with the choice that was stored
        first. Clients treat that as success and show the stored choice.

        Map any status not listed here, and any error code they do not know,
        to a neutral "voting is not possible right now".
      parameters:
        - $ref: '#/components/parameters/PollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: The vote was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteReceipt'
        '400':
          description: |
            `invalid_body`, `invalid_parameter` (`field` is `option_id` or
            `voter`), or `unsupported_client` for a request `schema_version`
            this server does not support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such poll, or it has not started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This installation has already voted. Carries the first choice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlreadyVoted'
        '410':
          description: The poll is closed (`poll_closed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /health/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness. 200 whenever the process is running.
      responses:
        '200':
          description: Running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness. 200 when the database answers.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    PollId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    RateLimited:
      description: Too many requests. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    ETag:
      description: Weak validator of the complete applicable collection. Opaque; send it back unchanged.
      schema:
        type: string
    CacheControl:
      description: Always `no-cache`. Responses may be stored but must be revalidated.
      schema:
        type: string
        const: no-cache
  schemas:
    Platform:
      type: string
      enum: [web, android, ios, windows, linux, macos]
    NotificationList:
      type: object
      additionalProperties: false
      required: [schema_version, server_time, poll_after_seconds, next_cursor, notifications]
      properties:
        schema_version:
          type: integer
          const: 1
        server_time:
          $ref: '#/components/schemas/Timestamp'
        poll_after_seconds:
          type: integer
          minimum: 1
          description: Suggested delay before the next poll. Includes a small random jitter.
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page. `null` on the last page.
        notifications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Notification'
    Notification:
      type: object
      additionalProperties: false
      required: [id, revision, attention_revision, title, body, type, published_at, expires_at, link]
      properties:
        id:
          type: string
          format: uuid
          description: Stable across edits.
        revision:
          type: integer
          minimum: 1
          description: Incremented by every material edit. Update the content in place, do not re-alert.
        attention_revision:
          type: integer
          minimum: 1
          description: Incremented only by important edits. Re-alert if it is above the locally read value, unless the notification was dismissed on this device.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Plain text.
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text, may contain line breaks.
        type:
          $ref: '#/components/schemas/NotificationType'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        link:
          oneOf:
            - $ref: '#/components/schemas/Link'
            - type: 'null'
        poll:
          $ref: '#/components/schemas/Poll'
    NotificationType:
      type: object
      additionalProperties: false
      required: [key, label, color, icon, critical]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
        label:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        icon:
          type: string
          description: |
            One of the allowlisted icon names `info`, `update`, `wrench`,
            `warning`, `bell`, `calendar`, `megaphone`, `shield`, `star`,
            `poll`. New names can appear; map unknown names to a fallback.
        critical:
          type: boolean
          description: If true the popup must be closed manually.
    Link:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, target]
          properties:
            kind:
              type: string
              const: internal
            target:
              type: string
              description: |
                App route key: `homework`, `grades`, `absences`, `calendar`,
                `examCalendar`, `classRegister`, `courseMaterials`,
                `homeworkSummary`, `certificate`, `messages`, `settings`,
                `profile`.
        - type: object
          additionalProperties: false
          required: [kind, target]
          properties:
            kind:
              type: string
              const: external
            target:
              type: string
              format: uri
              pattern: '^https://'
              maxLength: 2048
    Poll:
      type: object
      additionalProperties: false
      description: |
        Present only on poll notifications (1.2.0). Render a poll screen only
        for a `type` this client knows; otherwise show the notification and its
        `link`. A notification with a broken `poll` object is a plain
        notification too.
      required: [id, type, question, options, opens_at, closes_at, show_results]
      properties:
        id:
          type: string
          format: uuid
          description: Poll id, used by the poll endpoints. Not the notification id.
        type:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,31}$'
          description: |
            `single_choice`: exactly one option per vote. New types can appear;
            clients that do not know a type fall back to the notification.
        question:
          type: string
          minLength: 1
          maxLength: 120
          description: Plain text, in the requested language or German.
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/PollOption'
        opens_at:
          $ref: '#/components/schemas/Timestamp'
        closes_at:
          $ref: '#/components/schemas/Timestamp'
        show_results:
          type: boolean
          description: Whether voters may see the aggregated result.
    PollOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,36}$'
          description: Stable for the life of the poll. Send it back as `option_id`.
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Plain text.
    PollResults:
      type: object
      additionalProperties: false
      description: Aggregated counts. Votes per installation, not per person.
      required: [total_votes, options]
      properties:
        total_votes:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, votes]
            properties:
              id:
                type: string
                pattern: '^[A-Za-z0-9_-]{1,36}$'
              votes:
                type: integer
                minimum: 0
    PollState:
      type: object
      additionalProperties: false
      required: [schema_version, server_time, poll, status, results]
      properties:
        schema_version:
          type: integer
          const: 1
        server_time:
          $ref: '#/components/schemas/Timestamp'
        poll:
          $ref: '#/components/schemas/Poll'
        status:
          type: string
          description: |
            `open` accepts votes, `closed` does not (`closes_at` has passed).
            Treat any other value as "cannot vote".
          examples: [open, closed]
        results:
          oneOf:
            - $ref: '#/components/schemas/PollResults'
            - type: 'null'
    VoteRequest:
      type: object
      additionalProperties: true
      description: |
        Unknown fields are accepted and ignored, so newer clients can send more
        without breaking older servers.
      required: [option_id, voter]
      properties:
        option_id:
          type: string
          maxLength: 36
        voter:
          type: string
          format: uuid
          description: |
            Random UUID (version 4) the client created for itself and keeps
            locally. Not derived from any device property. Sent only with a
            vote.
        schema_version:
          type: integer
          default: 1
          description: Request format. A value the server does not support gets `400 unsupported_client`.
        attestation:
          type: object
          description: |
            Reserved for a later platform attestation (Play Integrity, App
            Attest). Ignored today; do not send it yet.
    VoteReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, poll_id, option_id, results]
      properties:
        schema_version:
          type: integer
          const: 1
        poll_id:
          type: string
          format: uuid
        option_id:
          type: string
          description: The stored choice.
        results:
          oneOf:
            - $ref: '#/components/schemas/PollResults'
            - type: 'null'
    AlreadyVoted:
      type: object
      additionalProperties: false
      required: [error, poll_id, option_id, results]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              const: already_voted
            message:
              type: string
        poll_id:
          type: string
          format: uuid
        option_id:
          type: string
          description: The choice stored with the first vote.
        results:
          oneOf:
            - $ref: '#/components/schemas/PollResults'
            - type: 'null'
    Timestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
      description: UTC, RFC 3339, whole seconds.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [invalid_parameter, invalid_cursor, invalid_body, rate_limited, not_found, poll_closed, unsupported_client, internal_error]
            message:
              type: string
              description: Human-readable English message. Do not parse it.
            field:
              type: string
              description: Offending parameter, if there is exactly one.
